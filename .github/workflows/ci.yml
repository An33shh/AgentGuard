name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check agentguard/ api/ tests/

      - name: Run tests
        run: pytest tests/ -v --tb=short

  test-rust:
    name: Test with Rust extension
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: agentguard_rs/target
          key: rust-${{ hashFiles('agentguard_rs/Cargo.toml', 'agentguard_rs/src/lib.rs') }}

      - name: Create virtualenv and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"

      - name: Build and install Rust extension
        run: |
          source .venv/bin/activate
          maturin develop --release --manifest-path agentguard_rs/Cargo.toml

      - name: Confirm Rust extension loaded
        run: .venv/bin/python -c "from agentguard.policy._native import RUST_AVAILABLE; assert RUST_AVAILABLE"

      - name: Run tests with Rust extension active
        run: .venv/bin/pytest tests/ -v --tb=short

  test-migrations:
    name: Verify Alembic migrations against real Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agentguard
          POSTGRES_PASSWORD: agentguard
          POSTGRES_DB: agentguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run Alembic migrations against real Postgres
        env:
          DATABASE_URL: postgresql://agentguard:agentguard@localhost:5432/agentguard
        run: alembic upgrade head

      - name: Verify migrated schema matches the SQLAlchemy models
        env:
          AGENTGUARD_TEST_DATABASE_URL: postgresql+asyncpg://agentguard:agentguard@localhost:5432/agentguard
        run: pytest tests/test_migration_integrity.py -v

  secrets-scan:
    name: Scan for secrets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
